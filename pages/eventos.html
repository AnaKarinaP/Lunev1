  <!-- FAVICON -->
  <link rel="apple-touch-icon" sizes="180x180" href="../imagenes/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../imagenes/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../imagenes/favicon/favicon-16x16.png">
  <link rel="manifest" href="../imagenes/favicon/site.webmanifest">
  <link rel="shortcut icon" href="../imagenes/favicon/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="../style.css" />
  <title>LUNE PASTELERIA - Eventos</title>
  <meta name="description" content="Pastelería hecha con amor en el corazón de la ciudad. LUNE te invita a disfrutar de nuestros eventos y crear momentos dulces.">
  <meta name="keywords" content="eventos con pastelería, cumpleaños, celebraciones dulces, catering dulce, repostería para eventos, eventos pequeños, LUNE eventos">


</head>

<body>
  <header class="menu-sticky">
    <nav>
      <p class="logo">LUNE</p>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="./productos.html">Productos</a></li>
        <li><a href="./eventos.html">Eventos</a></li>
        <li><a href="./clases.html">Clases</a></li>
        <li><a href="./nosotros.html">Nosotros</a></li>
      </ul>
    </nav>
  </header>

  <main class="eventos-bg">
    <div class="containerr" style="position: relative;">
      <div class="sello">Hecho a Mano</div>
      <div class="evento-box">
        <h1>Eventos</h1>
        <p>Planificamos eventos para un máximo de 20 personas.</p>
      </div>

      <h3>Reservá tu evento</h3>
      <form class="form-evento" action="/reservar-evento" method="post">
        <input type="text" placeholder="Tu nombre" required>
        <input type="email" placeholder="Tu correo" required>
        <textarea placeholder="Contanos qué evento querés organizar" required></textarea>
        <button type="submit">Enviar consulta</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        <form action="#" method="post">
          <label for="contacto">Dejanos tu consulta:</label>
          <input type="text" name="contacto" id="contacto" placeholder="Escribí tu mensaje acá" />
          <button type="submit">Enviar</button>
        </form>
      </div>
      <div class="footer-right">
        <p>&copy; 2025 LUNE. Todos los derechos reservados.</p>
      </div>
    </div>
    <div class="footer-bottom-center">
      <p>Seguinos en: <strong>@lune.mam</strong></p>
    </div>
  </footer>
</body>
</html>
