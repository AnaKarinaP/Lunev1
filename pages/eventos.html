<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
  <title>LUNE PASTELERIA - Eventos</title>
</head>
<body>
  <header class="menu-sticky">
    <nav>
      <p class="logo">LUNE</p>
      <ul>
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="./productos.html">Productos</a></li>
        <li><a href="./eventos.html">Eventos</a></li>
        <li><a href="./clases.html">Clases</a></li>
        <li><a href="./nosotros.html">Nosotros</a></li>
      </ul>
    </nav>
  </header>

  <main class="eventos-bg">
    <div class="containerr" style="position: relative;">
      <div class="sello">Hecho a Mano</div>
      <div class="evento-box">
        <h1>Eventos</h1>
        <p>Planificamos eventos para un máximo de 20 personas.</p>
      </div>

      <h3>Reservá tu evento</h3>
      <form class="form-evento" action="/reservar-evento" method="post">
        <input type="text" placeholder="Tu nombre" required>
        <input type="email" placeholder="Tu correo" required>
        <textarea placeholder="Contanos qué evento querés organizar" required></textarea>
        <button type="submit">Enviar consulta</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        <form action="#" method="post">
          <label for="contacto">Dejanos tu consulta:</label>
          <input type="text" name="contacto" id="contacto" placeholder="Escribí tu mensaje acá" />
          <button type="submit">Enviar</button>
        </form>
      </div>
      <div class="footer-right">
        <p>&copy; 2025 LUNE. Todos los derechos reservados.</p>
      </div>
    </div>
    <div class="footer-bottom-center">
      <p>Seguinos en: <strong>@lune.mam</strong></p>
    </div>
  </footer>
</body>
</html>
