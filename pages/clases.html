  <link rel="icon" type="image/png" sizes="16x16" href="../imagenes/favicon/favicon-16x16.png">

  <link rel="stylesheet" href="../style.css" />
  <title>LUNE PASTELERIA - Clases</title>
  <meta name="description" content="Pastelería hecha con amor en el corazón de la ciudad. LUNE te invita a disfrutar de nuestas clases y crear momentos dulces.">
  <meta name="keywords" content="clases de pastelería, talleres de repostería, curso de tartas, curso de cookies, aprender repostería, clases personalizadas, LUNE clases">


</head>

  <body>
    <header class="menu-sticky">
      <nav>
        <p class="logo">LUNE</p>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./productos.html">Productos</a></li>
          <li><a href="./eventos.html">Eventos</a></li>
          <li><a href="./nosotros.html">Nosotros</a></li>
        </ul>
      </nav>
    </header>

    <main class="clases-main">
      <div class="container">
        <h1>Clases</h1>
        <p>Ofrecemos talleres de pastelería personalizados para grupos reducidos.</p>
        <h3>Inscribite</h3>
        <form class="form-evento" action="/inscripcion" method="post">
          <input type="text" placeholder="Tu nombre" required />
          <input type="email" placeholder="Tu correo" required />
          <textarea placeholder="¿Qué te gustaría aprender?" required></textarea>
          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-left">
          <form action="#" method="post">
            <label for="contacto">Dejanos tu consulta:</label>
            <input
              type="text"
              name="contacto"
              id="contacto"
              placeholder="Escribí tu mensaje acá"
            />
            <button type="submit">Enviar</button>
          </form>
        </div>

        <div class="footer-right">
          <p>&copy; 2025 LUNE. Todos los derechos reservados.</p>
        </div>
      </div>

      <div class="footer-bottom-center">
        <p>Seguinos en: <strong>@lune.mam</strong></p>
      </div>
    </footer>
  </body>
